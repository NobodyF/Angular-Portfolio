<div id="projects" class="projects-page">
  <img class="deco-net" src="assets/aisvg.svg" alt="" aria-hidden="true">
  <img class="deco-dots" src="assets/dotsvg.svg" alt="" aria-hidden="true">
  <div class="projects-container">
    <a routerLink="/" class="back-link"><span aria-hidden="true">←</span> Back to home</a>
    <h1>Projects</h1>
    <p class="subtitle">A selection of my work across GenAI, computer vision, and Web3.</p>

    <div class="filter-tabs" role="group" aria-label="Filter projects by category">
      <button
        *ngFor="let category of categories"
        type="button"
        class="filter-tab"
        [class.active]="category === activeCategory"
        [attr.aria-pressed]="category === activeCategory"
        (click)="setCategory(category)">
        {{ category }} <span class="count">{{ countFor(category) }}</span>
      </button>
    </div>

    <div class="card-grid">
      <article class="card" *ngFor="let project of filteredProjects" [class.is-link]="!!project.repoUrl">
        <div class="card-thumb" [attr.data-category]="project.category" aria-hidden="true">
          <img class="card-icon" [src]="project.icon" alt="">
        </div>
        <div class="card-body">
          <h2>{{ project.title }}</h2>
          <p>{{ project.description }}</p>
          <ul class="tags">
            <li class="tag" *ngFor="let tag of project.tags">{{ tag }}</li>
          </ul>
          <!-- The link's ::after stretches over the whole card, making the card clickable -->
          <a
            *ngIf="project.repoUrl; else privateRepo"
            class="card-link"
            [href]="project.repoUrl"
            target="_blank"
            rel="noopener"
            [attr.aria-label]="'View ' + project.title + ' on GitHub'">
            View on GitHub <span aria-hidden="true">→</span>
          </a>
          <ng-template #privateRepo>
            <span class="card-link private">Private repo</span>
          </ng-template>
        </div>
      </article>
    </div>
  </div>
</div>
<app-footer></app-footer>
