<nav class="sticky-nav" aria-label="Section navigation">
  <ul>
    <li *ngFor="let section of sections">
      <button
        type="button"
        class="nav-dot"
        [attr.aria-label]="'Scroll to ' + section + ' section'"
        (click)="scrollToSection(section)">
        <div class="square" [ngStyle]="{ 'background-color': activeColor }"></div>
      </button>
    </li>
  </ul>
</nav>
